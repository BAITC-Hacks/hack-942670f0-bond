<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="900" viewBox="0 0 1000 900" role="img" aria-labelledby="title"><title id="title">Архитектура Vertex: данные, метрики, роли, интерфейс</title><rect width="1000" height="900" fill="#0d1723"/><style>text{font-family:Arial,sans-serif;fill:#e7f3f1} .sub{fill:#afc2ce;font-size:17px}</style><text x="60" y="55" font-size="30">ВЕРШИНА · архитектура анализа</text><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="#6fe3c4"/></marker></defs><rect x="60" y="90" width="880" height="82" rx="10" fill="#162b3c" stroke="#33576a"/><text x="86" y="121" font-size="23">1. Parquet</text><text x="86" y="149" class="sub">Узлы · рёбра · переводы</text><path d="M500 172 V198" stroke="#6fe3c4" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="200" width="880" height="82" rx="10" fill="#162b3c" stroke="#33576a"/><text x="86" y="231" font-size="23">2. Валидация → DiGraph</text><text x="86" y="259" class="sub">Все узлы · денежные веса · канонический порядок</text><path d="M500 282 V308" stroke="#6fe3c4" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="310" width="880" height="82" rx="10" fill="#162b3c" stroke="#33576a"/><text x="86" y="341" font-size="23">3. Метрики + Louvain</text><text x="86" y="369" class="sub">PageRank · HITS · betweenness · циклы · лаги</text><path d="M500 392 V418" stroke="#6fe3c4" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="420" width="880" height="82" rx="10" fill="#162b3c" stroke="#33576a"/><text x="86" y="451" font-size="23">4. Роли → приоритет → кейсы</text><text x="86" y="479" class="sub">Сначала слепая зона и терминалы · нейтральные гипотезы</text><path d="M500 502 V528" stroke="#6fe3c4" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="530" width="880" height="82" rx="10" fill="#162b3c" stroke="#33576a"/><text x="86" y="561" font-size="23">5. Контракт результатов</text><text x="86" y="589" class="sub">3 CSV + graph / summary / cases / resilience JSON</text><path d="M500 612 V638" stroke="#6fe3c4" stroke-width="2" marker-end="url(#arrow)"/><rect x="60" y="640" width="880" height="82" rx="10" fill="#162b3c" stroke="#33576a"/><text x="86" y="671" font-size="23">6. Автономный интерфейс</text><text x="86" y="699" class="sub">Граф · кейсы · устойчивость · ассистент</text><text x="60" y="785" class="sub">Louvain: неориентированная проекция, seed=42.</text><text x="60" y="815" class="sub">Кейсы: локальные заметки + экспорт/импорт по версии анализа.</text><text x="60" y="845" class="sub">OpenAI: необязательный локальный сервер; ключ только в окружении.</text><text x="60" y="875" class="sub">Роли и гипотезы — основания для проверки, не установление виновности.</text></svg>
